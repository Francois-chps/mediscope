[project]
name = "mediscope-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francois-chps", email = "francois4.chapuis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "selectolax>=1.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
]
[tool.mypy]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.importlinter]
root_package = "mediscope_ml"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "mediscope_ml.ingestion.adapters",
    "mediscope_ml.ingestion.application",
    "mediscope_ml.ingestion.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of third-party libraries"
type = "forbidden"
source_modules = ["mediscope_ml.ingestion.domain", "mediscope_ml.ingestion.application"]
forbidden_modules = ["selectolax"]
